name: Sona Telegram Bot 24/7 Cloud Runner

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Actions tab se manual Start button
  schedule:
    # Har 5 ghante me auto-restart (Continuous 24/7)
    - cron: '0 */5 * * *'

concurrency:
  group: devu-bot-runner
  cancel-in-progress: true

jobs:
  run-devu:
    name: 💖 Sona 24/7 Cloud Host
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Max 5.8 hours per session

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 💾 Restore Saved Database (if exists)
        uses: actions/cache@v4
        with:
          path: devu_data.db
          key: devu-db-${{ github.run_id }}
          restore-keys: |
            devu-db-

      - name: 🚀 Run Sona Bot (5 Hours Continuous Session)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          MAX_RUNTIME: 18000 # 5 Hours (Graceful handoff)
        run: |
          python bot.py

      - name: 💾 Save Updated Database
        uses: actions/cache/save@v4
        if: always()
        with:
          path: devu_data.db
          key: devu-db-${{ github.run_id }}
